# The proxy's main configuration (ARCHITECTURE.md D-16). The servers are rendered at start from
# templates/default.conf.template into conf.d/.

# One worker: the family's traffic needs no more, and each worker costs RAM, Railway's main cost driver (NFR-7).
worker_processes  1;

# nginx's error lines carry the client address in a fixed format; they are written only when something fails.
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # The image runs as the unprivileged nginx user, so every temporary path is under /tmp.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Slashes kept as sent, as the app keeps them, so the path the app is sent (the server template) keeps them too.
    # Set here, not in a server: nginx parses the request line before it knows the server, under the default server's
    # setting.
    merge_slashes off;

    # The path as the client sent it, not nginx's decoded and resolved $uri, so the log shows what the client asked for:
    # with $uri, /metrics/x%2F../.. was logged as /. The app is sent the resolved path (the server template), so for
    # /x/../health the log shows /x/../health and the app receives /health. The query string is cut off.
    map $request_uri $proxy_request_path {
        "~^(?<proxy_path>[^?]*)"  $proxy_path;
    }

    # No client address and no query string: the first is personal data, the second can carry tokens
    # (CONVENTIONS.md §7, §11).
    log_format  proxy  '$time_iso8601 $host "$request_method $proxy_request_path $server_protocol" $status $body_bytes_sent $request_time';
    access_log  /dev/stdout  proxy;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
